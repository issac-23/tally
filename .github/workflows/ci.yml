name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this job only checks out and builds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:run

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Nothing useful to report from a throwaway runner.
          NEXT_TELEMETRY_DISABLED: "1"

      # The fixture layer stubs out Supabase entirely. This asserts the
      # NODE_ENV guard still keeps it out of the production bundle.
      - run: npm run verify:no-fixtures
