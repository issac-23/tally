# CodeQL static analysis.
#
# Advanced setup rather than the Security-tab toggle, so the configuration
# lives in the repo and changes to it go through review like anything else.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code rather than waiting
    # for the next push.
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Writing the results back to the Security tab.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          # security-extended picks up lower-severity rules the default pack
          # skips. The repo is small enough to afford the noise.
          queries: security-extended

      # No build step: CodeQL reads JS/TS directly, and `next build` would
      # only add a few minutes and a Supabase dependency for nothing.
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
