# Supabase pauses a free-tier project after 7 days with no activity, and
# restoring it is manual.
#
# pg_cron inside the database does NOT count — the activity has to arrive
# from outside, through the API gateway.
#
# This used to read from `categories`. It returned HTTP 200 for three weeks
# and the project paused anyway, three days after a successful ping, so a
# read was evidently not resetting the clock. It writes now.
name: keep supabase awake

on:
  schedule:
    # Daily. The old every-third-day schedule left no room to notice a
    # problem: the run that caught the pause was also the first one that
    # could have prevented it.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X PATCH \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"beat_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1")

          echo "HTTP ${status}"
          cat /tmp/body

          # Only a 200 counts now. The old job accepted 401/403 on the theory
          # that a rejected request still reached Postgres; that theory is
          # what let three weeks of green runs hide a project going to sleep.
          if [ "${status}" != "200" ]; then
            echo
            echo "heartbeat write failed — the project may be paused."
            echo "check https://supabase.com/dashboard"
            exit 1
          fi

          echo "project is awake"
