# Dependabot version updates.
#
# Security alerts are separate and come from GitHub itself — this file is
# what opens PRs to actually fix them, plus routine version bumps.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Enough to keep things moving without burying the PR list.
    open-pull-requests-limit: 5
    # Next, React and Tailwind move fast and break things across majors.
    # Minor and patch land on their own; majors get read first.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # @vitest/ui peer-depends on an exact vitest version, and vitest 5
      # needs a newer @types/node than we had pinned. Bumped one at a time
      # they each fail `npm ci` on a peer conflict, so they move together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@types/node"
    # Two majors that cannot pass CI, and not because anything here is out
    # of date — the plugins eslint-config-next pulls in have not shipped
    # support at any published version:
    #
    #   typescript-eslint@8.71.1   peer typescript: >=4.8.4 <6.1.0
    #   eslint-plugin-react@7.37.5 peer eslint: ^3 || ... || ^9.7
    #
    # Both are already the newest releases, so there is nothing to upgrade
    # to. Recheck those two peer ranges before removing either ignore —
    # minor and patch updates still come through in the meantime.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"

  # The CI workflows pin action majors, which still drift.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
